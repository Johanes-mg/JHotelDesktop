[package]
name = "jhotel"
version = "1.1.2"
edition = "2021"
description = "Gestion hoteliere multi-vues"
authors = ["Johanes-mg"]

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"
image = { version = "0.25", features = ["png", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
rfd = "0.14"